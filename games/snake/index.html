<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Retro Snake</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#052e16,#0f172a);color:#dcfce7;font:16px system-ui,sans-serif;display:grid;place-items:center;padding:18px}.wrap{width:min(700px,100%);text-align:center}.top{display:flex;justify-content:space-between;align-items:center}.top h1{color:#86efac;margin:0;font-size:clamp(1.5rem,4vw,2.2rem)}button{border:1px solid #4ade80;background:#14532d;color:#dcfce7;border-radius:10px;padding:10px 15px;font-weight:700;cursor:pointer}canvas{width:100%;max-height:72vh;aspect-ratio:1;background:#020617;border:2px solid #4ade80;border-radius:15px;image-rendering:pixelated;touch-action:none}.hint{color:#86a391}
:root{color-scheme:dark}body{background:radial-gradient(circle at 50% -15%,#1e3a8a,#020617 70%)!important;position:relative;isolation:isolate}body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.25;background-image:linear-gradient(rgba(56,189,248,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(56,189,248,.08) 1px,transparent 1px),radial-gradient(circle at 20% 20%,#8b5cf655,transparent 32%);background-size:34px 34px,34px 34px,100% 100%;animation:arcadeDrift 18s linear infinite}@keyframes arcadeDrift{to{background-position:68px 68px,-68px 0,0 0}}canvas{border-radius:20px!important;box-shadow:0 0 0 1px #67e8f955,0 0 42px #0ea5e955,inset 0 0 30px #0008!important}.arcade-toolbar{position:fixed;top:14px;left:50%;transform:translateX(-50%);width:min(900px,calc(100% - 24px));z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 13px;border:1px solid #67e8f955;border-radius:15px;background:#020617cc;backdrop-filter:blur(16px);box-shadow:0 12px 36px #0008}.arcade-toolbar button{border:1px solid #38bdf8;background:#0f172a;color:#e0f2fe;border-radius:9px;padding:8px 11px;font-weight:800;cursor:pointer}.arcade-toolbar button:hover{background:#1e3a8a}.arcade-toolbar strong{color:#67e8f9;font-size:.78rem;letter-spacing:.12em}.arcade-toolbar span{color:#c4b5fd;font-size:.8rem}.arcade-toolbar b{color:#fef08a}</style></head><body><main class="wrap"><div class="top"><button onclick="location.href='../../index.html'">← Games</button><h1>🐍 Retro Snake</h1><button onclick="restart()">Restart</button></div><p id="score">Score: 0</p><canvas id="game" width="600" height="600"></canvas><p class="hint">Use arrow keys or swipe. Eat the glowing fruit and avoid yourself.</p></main><script>
const playmathDifficulty=(new URLSearchParams(location.search).get('difficulty')||localStorage.getItem('playmathDifficulty')||'normal').toLowerCase();const stepMs={easy:150,normal:115,hard:88,impossible:62}[playmathDifficulty]||115;
const c=document.getElementById('game'),ctx=c.getContext('2d'),N=25,S=c.width/N;let snake,food,dir,next,score,dead,timer;function restart(){snake=[{x:12,y:12},{x:11,y:12},{x:10,y:12}];dir={x:1,y:0};next={x:1,y:0};score=0;dead=false;food=spawn();document.getElementById('score').textContent='Score: 0';clearInterval(timer);timer=setInterval(tick,stepMs);draw()}function spawn(){let f;do f={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)};while(snake&&snake.some(p=>p.x===f.x&&p.y===f.y));return f}function change(x,y){if(x!==-dir.x||y!==-dir.y)next={x,y}}addEventListener('keydown',e=>{const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};if(m[e.key]){e.preventDefault();change(...m[e.key])}if(dead&&e.key.toLowerCase()==='r')restart()});let sx,sy;c.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});c.addEventListener('pointerup',e=>{let dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<15)return;if(Math.abs(dx)>Math.abs(dy))change(Math.sign(dx),0);else change(0,Math.sign(dy))});function tick(){if(dead)return;dir=next;let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.x>=N||h.y<0||h.y>=N||snake.some(p=>p.x===h.x&&p.y===h.y)){dead=true;clearInterval(timer);draw();return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score+=10;food=spawn();document.getElementById('score').textContent='Score: '+score}else snake.pop();draw()}function draw(){ctx.fillStyle='#020617';ctx.fillRect(0,0,c.width,c.height);ctx.strokeStyle='#0f2e20';for(let i=1;i<N;i++){ctx.beginPath();ctx.moveTo(i*S,0);ctx.lineTo(i*S,c.height);ctx.moveTo(0,i*S);ctx.lineTo(c.width,i*S);ctx.stroke()}ctx.fillStyle='#fb7185';ctx.beginPath();ctx.arc(food.x*S+S/2,food.y*S+S/2,S*.32,0,Math.PI*2);ctx.fill();snake.forEach((p,i)=>{ctx.fillStyle=i?'#4ade80':'#bbf7d0';ctx.fillRect(p.x*S+2,p.y*S+2,S-4,S-4)});if(dead){ctx.fillStyle='#000a';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 40px system-ui';ctx.fillText('SNAKE STOPPED',c.width/2,c.height/2);ctx.font='18px system-ui';ctx.fillText('Press R or Restart',c.width/2,c.height/2+35)}}restart();
</script></body></html>

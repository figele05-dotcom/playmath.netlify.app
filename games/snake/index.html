<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Retro Snake</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#052e16,#0f172a);color:#dcfce7;font:16px system-ui,sans-serif;display:grid;place-items:center;padding:18px}.wrap{width:min(700px,100%);text-align:center}.top{display:flex;justify-content:space-between;align-items:center}.top h1{color:#86efac;margin:0;font-size:clamp(1.5rem,4vw,2.2rem)}button{border:1px solid #4ade80;background:#14532d;color:#dcfce7;border-radius:10px;padding:10px 15px;font-weight:700;cursor:pointer}canvas{width:100%;max-height:72vh;aspect-ratio:1;background:#020617;border:2px solid #4ade80;border-radius:15px;image-rendering:pixelated;touch-action:none}.hint{color:#86a391}
:root{color-scheme:dark}body{background:radial-gradient(circle at 50% -15%,#1e3a8a,#020617 70%)!important;position:relative;isolation:isolate}body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.25;background-image:linear-gradient(rgba(56,189,248,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(56,189,248,.08) 1px,transparent 1px),radial-gradient(circle at 20% 20%,#8b5cf655,transparent 32%);background-size:34px 34px,34px 34px,100% 100%;animation:arcadeDrift 18s linear infinite}@keyframes arcadeDrift{to{background-position:68px 68px,-68px 0,0 0}}canvas{border-radius:20px!important;box-shadow:0 0 0 1px #67e8f955,0 0 42px #0ea5e955,inset 0 0 30px #0008!important}.arcade-toolbar{position:fixed;top:14px;left:50%;transform:translateX(-50%);width:min(900px,calc(100% - 24px));z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 13px;border:1px solid #67e8f955;border-radius:15px;background:#020617cc;backdrop-filter:blur(16px);box-shadow:0 12px 36px #0008}.arcade-toolbar button{border:1px solid #38bdf8;background:#0f172a;color:#e0f2fe;border-radius:9px;padding:8px 11px;font-weight:800;cursor:pointer}.arcade-toolbar button:hover{background:#1e3a8a}.arcade-toolbar strong{color:#67e8f9;font-size:.78rem;letter-spacing:.12em}.arcade-toolbar span{color:#c4b5fd;font-size:.8rem}.arcade-toolbar b{color:#fef08a}.music-dock{position:fixed;right:16px;bottom:16px;z-index:40}.music-dock button,.game-admin-dock button{border:1px solid #67e8f9;background:#020617dd;color:#e0f2fe;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer;box-shadow:0 8px 28px #0008;backdrop-filter:blur(12px)}.music-dock button:hover,.game-admin-dock button:hover{background:#1e3a8a}.game-admin-dock{position:fixed;left:16px;bottom:16px;z-index:40;display:flex;align-items:center;gap:7px;flex-wrap:wrap;max-width:calc(100% - 100px);padding:10px;border:1px solid #22c55e99;border-radius:12px;background:#052e16dd;color:#bbf7d0;backdrop-filter:blur(12px);box-shadow:0 8px 28px #0008}.game-admin-dock[hidden]{display:none}.game-admin-dock strong{font-size:.75rem;letter-spacing:.1em}</style></head><body><div class="music-dock"><button id="gameMusicButton" onclick="toggleGameMusic()">🔊 Music: On</button></div><aside id="gameAdminDock" class="game-admin-dock" hidden><strong>🔐 ADMIN MODE</strong><button onclick="gameAdminCommand('power')">⚡ Power Mode</button><button onclick="gameAdminCommand('score')">🏆 Bonus</button><button onclick="location.reload()">↻ Reset</button></aside><script>const arcadeMusicState={enabled:localStorage.getItem('playmathMusic')!=='off'};let arcadeAudioContext=null,arcadeMusicTimer=null,arcadeMusicStep=0,arcadeMusicStarting=false;const arcadeLead=[261.63,329.63,392,523.25,659.25,523.25,392,329.63,293.66,369.99,440,587.33,739.99,587.33,440,369.99],arcadeBass=[130.81,130.81,146.83,146.83,164.81,164.81,146.83,146.83];function arcadeTone(f,d,v,t,w){if(!arcadeAudioContext)return;const o=arcadeAudioContext.createOscillator(),g=arcadeAudioContext.createGain();o.type=t||'square';o.frequency.value=f;o.connect(g);g.connect(arcadeAudioContext.destination);g.gain.setValueAtTime(.0001,w);g.gain.exponentialRampToValueAtTime(v,w+.018);g.gain.exponentialRampToValueAtTime(.0001,w+d);o.start(w);o.stop(w+d+.03)}function arcadeBeat(w){if(!arcadeAudioContext)return;arcadeTone(arcadeMusicStep%4===0?92:55,.08,.055,'sine',w);if(arcadeMusicStep%4===2)arcadeTone(180,.05,.025,'square',w)}function startGameMusic(){if(!arcadeMusicState.enabled||arcadeMusicTimer||arcadeMusicStarting)return;const A=window.AudioContext||window.webkitAudioContext;if(!A)return;if(!arcadeAudioContext)arcadeAudioContext=new A();arcadeMusicStarting=true;const begin=()=>{arcadeMusicStarting=false;if(!arcadeMusicState.enabled||arcadeMusicTimer)return;const tick=()=>{const w=arcadeAudioContext.currentTime;arcadeTone(arcadeLead[arcadeMusicStep%arcadeLead.length],.22,.065,'square',w);if(arcadeMusicStep%2===0)arcadeTone(arcadeBass[(arcadeMusicStep/2)%arcadeBass.length],.38,.04,'triangle',w);arcadeBeat(w);arcadeMusicStep++};tick();arcadeMusicTimer=setInterval(tick,260)};(arcadeAudioContext.state==='suspended'?arcadeAudioContext.resume():Promise.resolve()).then(begin).catch(()=>{arcadeMusicStarting=false})}function stopGameMusic(){clearInterval(arcadeMusicTimer);arcadeMusicTimer=null}function toggleGameMusic(){arcadeMusicState.enabled=!arcadeMusicState.enabled;localStorage.setItem('playmathMusic',arcadeMusicState.enabled?'on':'off');if(arcadeMusicState.enabled)startGameMusic();else stopGameMusic();updateGameMusicButton()}function updateGameMusicButton(){const b=document.getElementById('gameMusicButton');if(b)b.textContent=arcadeMusicState.enabled?'🔊 Music: On':'🔇 Music: Off'}function gameAdminCommand(command){if(sessionStorage.getItem('playmathAdmin')!=='1')return;window.dispatchEvent(new CustomEvent('playmath-admin-command',{detail:{command}}))}document.addEventListener('pointerdown',()=>{if(arcadeMusicState.enabled)startGameMusic()});document.addEventListener('keydown',()=>{if(arcadeMusicState.enabled)startGameMusic()});if(sessionStorage.getItem('playmathAdmin')==='1')document.getElementById('gameAdminDock').hidden=false;updateGameMusicButton();</script><main class="wrap"><div class="top"><button onclick="location.href='../../index.html'">← Games</button><h1>🐍 Retro Snake</h1><button onclick="restart()">Restart</button></div><p id="score">Score: 0</p><canvas id="game" width="600" height="600"></canvas><p class="hint">Use arrow keys or swipe. Eat the glowing fruit and avoid yourself.</p></main><script>
const playmathDifficulty=(new URLSearchParams(location.search).get('difficulty')||localStorage.getItem('playmathDifficulty')||'normal').toLowerCase();const stepMs={easy:150,normal:115,hard:88,impossible:62}[playmathDifficulty]||115;
const c=document.getElementById('game'),ctx=c.getContext('2d'),N=25,S=c.width/N;let snake,food,dir,next,score,dead,timer;function restart(){snake=[{x:12,y:12},{x:11,y:12},{x:10,y:12}];dir={x:1,y:0};next={x:1,y:0};score=0;dead=false;food=spawn();document.getElementById('score').textContent='Score: 0';clearInterval(timer);timer=setInterval(tick,stepMs);draw()}function spawn(){let f;do f={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)};while(snake&&snake.some(p=>p.x===f.x&&p.y===f.y));return f}function change(x,y){if(x!==-dir.x||y!==-dir.y)next={x,y}}addEventListener('keydown',e=>{const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};if(m[e.key]){e.preventDefault();change(...m[e.key])}if(dead&&e.key.toLowerCase()==='r')restart()});let sx,sy;c.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});c.addEventListener('pointerup',e=>{let dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<15)return;if(Math.abs(dx)>Math.abs(dy))change(Math.sign(dx),0);else change(0,Math.sign(dy))});function tick(){if(dead)return;dir=next;let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.x>=N||h.y<0||h.y>=N||snake.some(p=>p.x===h.x&&p.y===h.y)){dead=true;clearInterval(timer);draw();return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score+=10;food=spawn();document.getElementById('score').textContent='Score: '+score}else snake.pop();draw()}function draw(){ctx.fillStyle='#020617';ctx.fillRect(0,0,c.width,c.height);ctx.strokeStyle='#0f2e20';for(let i=1;i<N;i++){ctx.beginPath();ctx.moveTo(i*S,0);ctx.lineTo(i*S,c.height);ctx.moveTo(0,i*S);ctx.lineTo(c.width,i*S);ctx.stroke()}ctx.fillStyle='#fb7185';ctx.beginPath();ctx.arc(food.x*S+S/2,food.y*S+S/2,S*.32,0,Math.PI*2);ctx.fill();snake.forEach((p,i)=>{ctx.fillStyle=i?'#4ade80':'#bbf7d0';ctx.fillRect(p.x*S+2,p.y*S+2,S-4,S-4)});if(dead){ctx.fillStyle='#000a';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 40px system-ui';ctx.fillText('SNAKE STOPPED',c.width/2,c.height/2);ctx.font='18px system-ui';ctx.fillText('Press R or Restart',c.width/2,c.height/2+35)}}restart();
</script><script>window.addEventListener('playmath-admin-command',e=>{const c=e.detail&&e.detail.command;if(c==='power'){document.body.classList.toggle('admin-boost');try{if(typeof lives!=='undefined')lives=99;if(typeof frightenedUntil!=='undefined')frightenedUntil=Infinity;if(typeof gameRunning!=='undefined')gameRunning=true;if(typeof dead!=='undefined')dead=false;if(typeof gameOver!=='undefined')gameOver=false;if(typeof over!=='undefined')over=false;if(typeof cookies!=='undefined')cookies+=10000;if(typeof pick!=='undefined')pick=true;if(typeof draw==='function')draw();if(typeof updateHud==='function')updateHud();if(typeof render==='function')render()}catch(e){}}if(c==='score'){try{if(typeof score!=='undefined')score+=500;if(typeof cookies!=='undefined')cookies+=5000;if(typeof updateHud==='function')updateHud();if(typeof render==='function')render();if(typeof draw==='function')draw()}catch(e){}}});</script></body></html>

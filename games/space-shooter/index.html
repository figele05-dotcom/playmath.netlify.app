<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Space Shooter</title><style>
:root{--cyan:#67e8f9;--purple:#8b5cf6}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#172554,#050816 65%);color:#e0f2fe;font:16px system-ui,sans-serif;display:grid;place-items:center;padding:18px}.wrap{width:min(900px,100%);text-align:center}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}.top h1{margin:0;color:var(--cyan);font-size:clamp(1.4rem,4vw,2.2rem)}button{border:1px solid #38bdf8;background:#0f172a;color:#e0f2fe;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer}button:hover{background:#1e3a8a}canvas{width:100%;max-height:70vh;aspect-ratio:4/3;background:#020617;border:2px solid #38bdf8;border-radius:16px;box-shadow:0 0 34px #0ea5e955;touch-action:none}.hint{color:#94a3b8;margin:10px 0 0}</style></head><body><main class="wrap"><div class="top"><button onclick="location.href='../../index.html'">← Games</button><h1>🚀 Space Shooter</h1><button onclick="resetGame()">Restart</button></div><div id="stats">Score: 0 · Lives: 3</div><canvas id="game" width="800" height="600"></canvas><p class="hint">Move with A/D or ←/→ · Shoot with Space · Tap the canvas to fire</p></main><script>
const c=document.getElementById('game'),x=c.getContext('2d'),W=c.width,H=c.height;let keys={},player,bullets,enemies,score,lives,over,frame;
function resetGame(){player={x:W/2,y:H-55,w:32,h:24};bullets=[];enemies=[];score=0;lives=3;over=false;frame=0}function fire(){if(!over)bullets.push({x:player.x,y:player.y-20,vy:-9})}addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space'){e.preventDefault();fire()}if(over&&e.key.toLowerCase()==='r')resetGame()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);c.addEventListener('pointerdown',e=>{const r=c.getBoundingClientRect();player.x=(e.clientX-r.left)/r.width*W;fire()});c.addEventListener('pointermove',e=>{if(e.buttons){const r=c.getBoundingClientRect();player.x=(e.clientX-r.left)/r.width*W}});
function hit(a,b){return Math.abs(a.x-b.x)<(a.w+b.w)/2&&Math.abs(a.y-b.y)<(a.h+b.h)/2}function update(){if(over)return;frame++;if(keys.a||keys.arrowleft)player.x-=7;if(keys.d||keys.arrowright)player.x+=7;player.x=Math.max(25,Math.min(W-25,player.x));if(frame%34===0)enemies.push({x:30+Math.random()*(W-60),y:-25,w:28,h:22,vy:1.6+Math.random()*1.7});bullets=bullets.filter(b=>b.y>-20);bullets.forEach(b=>b.y+=b.vy);enemies.forEach(e=>e.y+=e.vy);for(let i=enemies.length-1;i>=0;i--){let e=enemies[i];let dead=false;for(let j=bullets.length-1;j>=0;j--)if(hit({x:bullets[j].x,y:bullets[j].y,w:5,h:16},e)){bullets.splice(j,1);enemies.splice(i,1);score+=10;dead=true;break}if(dead)continue;if(hit({x:player.x,y:player.y,w:player.w,h:player.h},e)||e.y>H+30){enemies.splice(i,1);lives--;if(lives<=0)over=true}}document.getElementById('stats').textContent='Score: '+score+' · Lives: '+lives}
function draw(){x.clearRect(0,0,W,H);x.fillStyle='#020617';x.fillRect(0,0,W,H);for(let i=0;i<50;i++){x.fillStyle=i%3?'#bae6fd55':'#fff';x.fillRect((i*137)%W,(i*71+frame*.3)%H,2,2)}x.fillStyle='#67e8f9';x.beginPath();x.moveTo(player.x,player.y-18);x.lineTo(player.x-18,player.y+14);x.lineTo(player.x,player.y+7);x.lineTo(player.x+18,player.y+14);x.closePath();x.fill();x.fillStyle='#fef08a';bullets.forEach(b=>x.fillRect(b.x-2,b.y-9,4,14));enemies.forEach(e=>{x.fillStyle='#f43f5e';x.beginPath();x.moveTo(e.x,e.y+14);x.lineTo(e.x-17,e.y-10);x.lineTo(e.x+17,e.y-10);x.closePath();x.fill();x.fillStyle='#fb7185';x.fillRect(e.x-10,e.y-3,20,5)});if(over){x.fillStyle='#000b';x.fillRect(0,0,W,H);x.fillStyle='#fff';x.textAlign='center';x.font='bold 44px system-ui';x.fillText('GAME OVER',W/2,H/2-15);x.font='20px system-ui';x.fillText('Press R or Restart to fly again',W/2,H/2+28)}}function loop(){update();draw();requestAnimationFrame(loop)}resetGame();loop();
</script></body></html>

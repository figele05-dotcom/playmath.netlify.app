<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory Match</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#312e81,#0f172a 65%);color:#f5f3ff;font:16px system-ui,sans-serif;padding:18px}.wrap{width:min(720px,100%);margin:auto;text-align:center}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.top h1{margin:0;color:#c4b5fd;font-size:clamp(1.5rem,4vw,2.2rem)}button{border:1px solid #a78bfa;background:#312e81;color:white;border-radius:10px;padding:10px 15px;font-weight:700;cursor:pointer}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px auto;max-width:560px}.card{aspect-ratio:1;border:0;border-radius:14px;background:linear-gradient(145deg,#4338ca,#7c3aed);color:transparent;font-size:clamp(1.8rem,7vw,3.5rem);cursor:pointer;box-shadow:0 7px 0 #1e1b4b;transition:.18s transform,.18s background}.card:hover{transform:translateY(-3px)}.card.open,.card.matched{background:#f5f3ff;color:#312e81;transform:translateY(3px);box-shadow:none}.hint{color:#c4b5fd}</style></head><body><main class="wrap"><div class="top"><button onclick="location.href='../../index.html'">← Games</button><h1>🧠 Memory Match</h1><button onclick="start()">New Game</button></div><p id="stats">Moves: 0 · Matches: 0/8</p><section id="board" class="board"></section><p class="hint">Find every pair in as few moves as possible.</p></main><script>
const icons=['🚀','🦊','🌈','⚡','🎯','🍕','🐸','🌟'];let board=[],first=null,lock=false,moves=0,matches=0;const el=document.getElementById('board');function shuffle(a){return a.sort(()=>Math.random()-.5)}function start(){board=shuffle([...icons,...icons]).map((v,i)=>({v,i,open:false,matched:false}));first=null;lock=false;moves=0;matches=0;render()}function render(){el.innerHTML='';board.forEach(card=>{let b=document.createElement('button');b.className='card '+(card.open||card.matched?'open ':'')+(card.matched?'matched':'');b.textContent=card.v;b.onclick=()=>flip(card);el.appendChild(b)});document.getElementById('stats').textContent='Moves: '+moves+' · Matches: '+matches+'/8'}function flip(card){if(lock||card.open||card.matched)return;card.open=true;render();if(!first){first=card;return}moves++;if(first.v===card.v){first.matched=card.matched=true;matches++;first=null;render();if(matches===8)setTimeout(()=>alert('You won in '+moves+' moves!'),150)}else{lock=true;setTimeout(()=>{first.open=card.open=false;first=null;lock=false;render()},650)}}start();
</script></body></html>

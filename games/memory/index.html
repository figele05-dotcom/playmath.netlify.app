<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory Match</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#312e81,#0f172a 65%);color:#f5f3ff;font:16px system-ui,sans-serif;padding:18px}.wrap{width:min(720px,100%);margin:auto;text-align:center}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.top h1{margin:0;color:#c4b5fd;font-size:clamp(1.5rem,4vw,2.2rem)}button{border:1px solid #a78bfa;background:#312e81;color:white;border-radius:10px;padding:10px 15px;font-weight:700;cursor:pointer}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px auto;max-width:560px}.card{aspect-ratio:1;border:0;border-radius:14px;background:linear-gradient(145deg,#4338ca,#7c3aed);color:transparent;font-size:clamp(1.8rem,7vw,3.5rem);cursor:pointer;box-shadow:0 7px 0 #1e1b4b;transition:.18s transform,.18s background}.card:hover{transform:translateY(-3px)}.card.open,.card.matched{background:#f5f3ff;color:#312e81;transform:translateY(3px);box-shadow:none}.hint{color:#c4b5fd}
:root{color-scheme:dark}body{background:radial-gradient(circle at 50% -15%,#1e3a8a,#020617 70%)!important;position:relative;isolation:isolate}body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.25;background-image:linear-gradient(rgba(56,189,248,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(56,189,248,.08) 1px,transparent 1px),radial-gradient(circle at 20% 20%,#8b5cf655,transparent 32%);background-size:34px 34px,34px 34px,100% 100%;animation:arcadeDrift 18s linear infinite}@keyframes arcadeDrift{to{background-position:68px 68px,-68px 0,0 0}}canvas{border-radius:20px!important;box-shadow:0 0 0 1px #67e8f955,0 0 42px #0ea5e955,inset 0 0 30px #0008!important}.arcade-toolbar{position:fixed;top:14px;left:50%;transform:translateX(-50%);width:min(900px,calc(100% - 24px));z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 13px;border:1px solid #67e8f955;border-radius:15px;background:#020617cc;backdrop-filter:blur(16px);box-shadow:0 12px 36px #0008}.arcade-toolbar button{border:1px solid #38bdf8;background:#0f172a;color:#e0f2fe;border-radius:9px;padding:8px 11px;font-weight:800;cursor:pointer}.arcade-toolbar button:hover{background:#1e3a8a}.arcade-toolbar strong{color:#67e8f9;font-size:.78rem;letter-spacing:.12em}.arcade-toolbar span{color:#c4b5fd;font-size:.8rem}.arcade-toolbar b{color:#fef08a}</style></head><body><main class="wrap"><div class="top"><button onclick="location.href='../../index.html'">← Games</button><h1>🧠 Memory Match</h1><button onclick="start()">New Game</button></div><p id="stats">Moves: 0 · Matches: 0/8</p><section id="board" class="board"></section><p class="hint">Find every pair in as few moves as possible.</p></main><script>
const playmathDifficulty=(new URLSearchParams(location.search).get('difficulty')||localStorage.getItem('playmathDifficulty')||'normal').toLowerCase();const pairCount={easy:6,normal:8,hard:10,impossible:12}[playmathDifficulty]||8;
const icons=['🚀','🦊','🌈','⚡','🎯','🍕','🐸','🌟','🎲','🪐','🧩','🛸'];let board=[],first=null,lock=false,moves=0,matches=0;const el=document.getElementById('board');function shuffle(a){return a.sort(()=>Math.random()-.5)}function start(){board=shuffle(icons.slice(0,pairCount).concat(icons.slice(0,pairCount))).map((v,i)=>({v,i,open:false,matched:false}));first=null;lock=false;moves=0;matches=0;render()}function render(){el.innerHTML='';board.forEach(card=>{let b=document.createElement('button');b.className='card '+(card.open||card.matched?'open ':'')+(card.matched?'matched':'');b.textContent=card.v;b.onclick=()=>flip(card);el.appendChild(b)});document.getElementById('stats').textContent='Moves: '+moves+' · Matches: '+matches+'/'+pairCount}function flip(card){if(lock||card.open||card.matched)return;card.open=true;render();if(!first){first=card;return}moves++;if(first.v===card.v){first.matched=card.matched=true;matches++;first=null;render();if(matches===pairCount)setTimeout(()=>alert('You won in '+moves+' moves!'),150)}else{lock=true;setTimeout(()=>{first.open=card.open=false;first=null;lock=false;render()},650)}}start();
</script></body></html>

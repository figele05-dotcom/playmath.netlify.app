<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crossy Roads</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
        }
        #gameCanvas {
            width: 100%;
            height: 600px;
            display: block;
            border: 3px solid #00d4ff;
        }
        .ui {
            background: #000;
            padding: 15px;
            text-align: center;
            border-top: 3px solid #00d4ff;
            color: #00d4ff;
            font-family: Arial, sans-serif;
            font-weight: bold;
        }
    
:root{color-scheme:dark}body{background:radial-gradient(circle at 50% -15%,#1e3a8a,#020617 70%)!important;position:relative;isolation:isolate}body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.25;background-image:linear-gradient(rgba(56,189,248,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(56,189,248,.08) 1px,transparent 1px),radial-gradient(circle at 20% 20%,#8b5cf655,transparent 32%);background-size:34px 34px,34px 34px,100% 100%;animation:arcadeDrift 18s linear infinite}@keyframes arcadeDrift{to{background-position:68px 68px,-68px 0,0 0}}canvas{border-radius:20px!important;box-shadow:0 0 0 1px #67e8f955,0 0 42px #0ea5e955,inset 0 0 30px #0008!important}.arcade-toolbar{position:fixed;top:14px;left:50%;transform:translateX(-50%);width:min(900px,calc(100% - 24px));z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 13px;border:1px solid #67e8f955;border-radius:15px;background:#020617cc;backdrop-filter:blur(16px);box-shadow:0 12px 36px #0008}.arcade-toolbar button{border:1px solid #38bdf8;background:#0f172a;color:#e0f2fe;border-radius:9px;padding:8px 11px;font-weight:800;cursor:pointer}.arcade-toolbar button:hover{background:#1e3a8a}.arcade-toolbar strong{color:#67e8f9;font-size:.78rem;letter-spacing:.12em}.arcade-toolbar span{color:#c4b5fd;font-size:.8rem}.arcade-toolbar b{color:#fef08a}</style>
</head>
<body><nav class="arcade-toolbar"><button onclick="location.href='../../index.html'">← Exit Lobby</button><strong>PLAYMATH ARCADE · Crossy Roads</strong><span>Difficulty: <b id="toolbarDifficulty">Normal</b></span><button onclick="location.reload()">↻ Restart</button></nav><script>document.getElementById('toolbarDifficulty').textContent=(new URLSearchParams(location.search).get('difficulty')||'normal').replace(/^./,c=>c.toUpperCase());</script>
    <div class="container">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        <div class="ui">Score: <span id="score">0</span> | Use Arrow Keys</div>
    </div>

    <script>
const playmathDifficulty=(new URLSearchParams(location.search).get('difficulty')||localStorage.getItem('playmathDifficulty')||'normal').toLowerCase();
const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        let score = 0;
        let gameRunning = true;
        const keys = {};

        const player = {
            x: canvas.width / 2 - 15,
            y: canvas.height - 50,
            size: 30,
            color: '#00d4ff'
        };

        let cars = [];
        let lanes = [];

        function playSound(freq, duration) {
            try {
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.connect(gain);
                gain.connect(audioContext.destination);
                osc.frequency.value = freq;
                osc.type = 'sine';
                gain.gain.setValueAtTime(0.1, audioContext.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
                osc.start(audioContext.currentTime);
                osc.stop(audioContext.currentTime + duration);
            } catch(e) {}
        }

        for (let i = 0; i < 8; i++) {
            lanes.push({
                y: canvas.height - 100 - (i * 60),
                speed: 2 + Math.random() * 3,
                direction: Math.random() > 0.5 ? 1 : -1,
                carWidth: 50,
                carHeight: 30
            });
        }

        function spawnCars() {
            lanes.forEach((lane, index) => {
                if (Math.random() < 0.02) {
                    cars.push({
                        x: lane.direction > 0 ? -lane.carWidth : canvas.width,
                        y: lane.y,
                        width: lane.carWidth,
                        height: lane.carHeight,
                        speed: lane.speed * lane.direction,
                        color: '#FF6B6B'
                    });
                }
            });
        }

        document.addEventListener('keydown', (e) => { keys[e.key] = true; });
        document.addEventListener('keyup', (e) => { keys[e.key] = false; });

        function update() {
            if (!gameRunning) return;

            if (keys['ArrowUp']) player.y = Math.max(0, player.y - 8);
            if (keys['ArrowDown']) player.y = Math.min(canvas.height - player.size, player.y + 8);
            if (keys['ArrowLeft']) player.x = Math.max(0, player.x - 8);
            if (keys['ArrowRight']) player.x = Math.min(canvas.width - player.size, player.x + 8);

            spawnCars();

            cars = cars.filter(car => {
                car.x += car.speed;
                
                if (car.x > player.x - car.width && car.x < player.x + player.size &&
                    car.y > player.y - car.height && car.y < player.y + player.size) {
                    gameRunning = false;
                    alert('Game Over! Score: ' + score);
                }

                return car.x > -car.width && car.x < canvas.width;
            });

            if (player.y < 100) {
                score += 10;
                player.y = canvas.height - 50;
                playSound(1500, 0.3);
            }

            document.getElementById('score').textContent = score;
        }

        function draw() {
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            lanes.forEach(lane => {
                ctx.fillStyle = '#333';
                ctx.fillRect(0, lane.y, canvas.width, lane.carHeight);
            });

            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.size, player.size);

            ctx.fillStyle = '#FF0000';
            cars.forEach(car => {
                ctx.fillRect(car.x, car.y, car.width, car.height);
            });
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>

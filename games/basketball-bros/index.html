<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Basketball Bros</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(160deg,#431407,#111827 70%);color:#ffedd5;font:16px system-ui,sans-serif;display:grid;place-items:center;padding:18px}.wrap{width:min(600px,100%);text-align:center}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.top h1{margin:0;color:#fdba74;font-size:clamp(1.4rem,4vw,2.1rem)}button{border:1px solid #fb923c;background:#9a3412;color:white;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}canvas{width:100%;max-height:70vh;aspect-ratio:4/5;border:2px solid #fb923c;border-radius:16px;background:#7c2d12;touch-action:none}.hint{color:#fdba74}
:root{color-scheme:dark}body{background:radial-gradient(circle at 50% -15%,#1e3a8a,#020617 70%)!important;position:relative;isolation:isolate}body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.25;background-image:linear-gradient(rgba(56,189,248,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(56,189,248,.08) 1px,transparent 1px),radial-gradient(circle at 20% 20%,#8b5cf655,transparent 32%);background-size:34px 34px,34px 34px,100% 100%;animation:arcadeDrift 18s linear infinite}@keyframes arcadeDrift{to{background-position:68px 68px,-68px 0,0 0}}canvas{border-radius:20px!important;box-shadow:0 0 0 1px #67e8f955,0 0 42px #0ea5e955,inset 0 0 30px #0008!important}.arcade-toolbar{position:fixed;top:14px;left:50%;transform:translateX(-50%);width:min(900px,calc(100% - 24px));z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 13px;border:1px solid #67e8f955;border-radius:15px;background:#020617cc;backdrop-filter:blur(16px);box-shadow:0 12px 36px #0008}.arcade-toolbar button{border:1px solid #38bdf8;background:#0f172a;color:#e0f2fe;border-radius:9px;padding:8px 11px;font-weight:800;cursor:pointer}.arcade-toolbar button:hover{background:#1e3a8a}.arcade-toolbar strong{color:#67e8f9;font-size:.78rem;letter-spacing:.12em}.arcade-toolbar span{color:#c4b5fd;font-size:.8rem}.arcade-toolbar b{color:#fef08a}.music-dock{position:fixed;right:16px;bottom:16px;z-index:40}.music-dock button,.game-admin-dock button{border:1px solid #67e8f9;background:#020617dd;color:#e0f2fe;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer;box-shadow:0 8px 28px #0008;backdrop-filter:blur(12px)}.music-dock button:hover,.game-admin-dock button:hover{background:#1e3a8a}.game-admin-dock{position:fixed;left:16px;bottom:16px;z-index:40;display:flex;align-items:center;gap:7px;flex-wrap:wrap;max-width:calc(100% - 100px);padding:10px;border:1px solid #22c55e99;border-radius:12px;background:#052e16dd;color:#bbf7d0;backdrop-filter:blur(12px);box-shadow:0 8px 28px #0008}.game-admin-dock[hidden]{display:none}.game-admin-dock strong{font-size:.75rem;letter-spacing:.1em}</style></head><body><div class="music-dock"><button id="gameMusicButton" onclick="toggleGameMusic()">🔊 Music: On</button></div><aside id="gameAdminDock" class="game-admin-dock" hidden><strong>🔐 ADMIN MODE</strong><button onclick="gameAdminCommand('power')">⚡ Power Mode</button><button onclick="gameAdminCommand('score')">🏆 Bonus</button><button onclick="location.reload()">↻ Reset</button></aside><script>const arcadeMusicState={enabled:localStorage.getItem('playmathMusic')!=='off'};let arcadeAudioContext=null,arcadeMusicTimer=null,arcadeMusicStep=0,arcadeMusicStarting=false;const arcadeLead=[261.63,329.63,392,523.25,659.25,523.25,392,329.63,293.66,369.99,440,587.33,739.99,587.33,440,369.99],arcadeBass=[130.81,130.81,146.83,146.83,164.81,164.81,146.83,146.83];function arcadeTone(f,d,v,t,w){if(!arcadeAudioContext)return;const o=arcadeAudioContext.createOscillator(),g=arcadeAudioContext.createGain();o.type=t||'square';o.frequency.value=f;o.connect(g);g.connect(arcadeAudioContext.destination);g.gain.setValueAtTime(.0001,w);g.gain.exponentialRampToValueAtTime(v,w+.018);g.gain.exponentialRampToValueAtTime(.0001,w+d);o.start(w);o.stop(w+d+.03)}function arcadeBeat(w){if(!arcadeAudioContext)return;arcadeTone(arcadeMusicStep%4===0?92:55,.08,.055,'sine',w);if(arcadeMusicStep%4===2)arcadeTone(180,.05,.025,'square',w)}function startGameMusic(){if(!arcadeMusicState.enabled||arcadeMusicTimer||arcadeMusicStarting)return;const A=window.AudioContext||window.webkitAudioContext;if(!A)return;if(!arcadeAudioContext)arcadeAudioContext=new A();arcadeMusicStarting=true;const begin=()=>{arcadeMusicStarting=false;if(!arcadeMusicState.enabled||arcadeMusicTimer)return;const tick=()=>{const w=arcadeAudioContext.currentTime;arcadeTone(arcadeLead[arcadeMusicStep%arcadeLead.length],.22,.065,'square',w);if(arcadeMusicStep%2===0)arcadeTone(arcadeBass[(arcadeMusicStep/2)%arcadeBass.length],.38,.04,'triangle',w);arcadeBeat(w);arcadeMusicStep++};tick();arcadeMusicTimer=setInterval(tick,260)};(arcadeAudioContext.state==='suspended'?arcadeAudioContext.resume():Promise.resolve()).then(begin).catch(()=>{arcadeMusicStarting=false})}function stopGameMusic(){clearInterval(arcadeMusicTimer);arcadeMusicTimer=null}function toggleGameMusic(){arcadeMusicState.enabled=!arcadeMusicState.enabled;localStorage.setItem('playmathMusic',arcadeMusicState.enabled?'on':'off');if(arcadeMusicState.enabled)startGameMusic();else stopGameMusic();updateGameMusicButton()}function updateGameMusicButton(){const b=document.getElementById('gameMusicButton');if(b)b.textContent=arcadeMusicState.enabled?'🔊 Music: On':'🔇 Music: Off'}function gameAdminCommand(command){if(sessionStorage.getItem('playmathAdmin')!=='1')return;window.dispatchEvent(new CustomEvent('playmath-admin-command',{detail:{command}}))}document.addEventListener('pointerdown',()=>{if(arcadeMusicState.enabled)startGameMusic()});document.addEventListener('keydown',()=>{if(arcadeMusicState.enabled)startGameMusic()});if(sessionStorage.getItem('playmathAdmin')==='1')document.getElementById('gameAdminDock').hidden=false;updateGameMusicButton();</script><main class="wrap"><div class="top"><button onclick="location.href='../../index.html'">← Games</button><h1>🏀 Basketball Bros</h1><button onclick="reset()">Restart</button></div><p id="stats">Score: 0 · Time: 30</p><canvas id="game" width="480" height="600"></canvas><p class="hint">Move with A/D or ←/→ · Press Space or tap to shoot</p></main><script>
const playmathDifficulty=(new URLSearchParams(location.search).get('difficulty')||localStorage.getItem('playmathDifficulty')||'normal').toLowerCase();const basketballTuning={easy:{time:40,hoopSpeed:1.5},normal:{time:30,hoopSpeed:2.2},hard:{time:22,hoopSpeed:3.3},impossible:{time:15,hoopSpeed:4.5}}[playmathDifficulty]||{time:30,hoopSpeed:2.2};
const c=document.getElementById('game'),ctx=c.getContext('2d'),W=c.width,H=c.height;let keys={},px,hoop,ball,score,time,over,last;function reset(){px=W/2;hoop={x:W/2,y:155,v:basketballTuning.hoopSpeed};ball=null;score=0;time=basketballTuning.time;over=false;last=performance.now();document.getElementById('stats').textContent='Score: 0 · Time: 30'}function shoot(){if(!ball&&!over)ball={x:px,y:480,vx:(hoop.x-px)*.018,vy:-10}}addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space'){e.preventDefault();shoot()}if(over&&e.key.toLowerCase()==='r')reset()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);c.addEventListener('pointerdown',shoot);function update(dt){if(over)return;if(keys.a||keys.arrowleft)px-=5;if(keys.d||keys.arrowright)px+=5;px=Math.max(35,Math.min(W-35,px));hoop.x+=hoop.v;if(hoop.x<65||hoop.x>W-65)hoop.v*=-1;if(ball){ball.x+=ball.vx;ball.y+=ball.vy;ball.vy+=.28;if(ball.y>H+30)ball=null;else if(ball.y>hoop.y-20&&ball.y<hoop.y+25&&Math.abs(ball.x-hoop.x)<34&&ball.vy>0){score++;ball=null}}time-=dt;if(time<=0){time=0;over=true}document.getElementById('stats').textContent='Score: '+score+' · Time: '+Math.ceil(time)}function draw(){ctx.clearRect(0,0,W,H);let grd=ctx.createLinearGradient(0,0,0,H);grd.addColorStop(0,'#9a3412');grd.addColorStop(1,'#431407');ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);ctx.fillStyle='#f97316';ctx.fillRect(0,520,W,80);ctx.strokeStyle='#fed7aa';ctx.lineWidth=4;ctx.beginPath();ctx.arc(W/2,520,160,Math.PI,0);ctx.stroke();ctx.fillStyle='#fef3c7';ctx.fillRect(hoop.x-55,hoop.y-55,110,8);ctx.strokeStyle='#fb923c';ctx.lineWidth=7;ctx.beginPath();ctx.arc(hoop.x,hoop.y-35,27,0,Math.PI*2);ctx.stroke();ctx.strokeStyle='#fff7ed';ctx.lineWidth=2;for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(hoop.x+i*10,hoop.y-8);ctx.lineTo(hoop.x+i*7,hoop.y+28);ctx.stroke()}ctx.fillStyle='#fed7aa';ctx.beginPath();ctx.arc(px,475,23,0,Math.PI*2);ctx.fill();ctx.fillStyle='#2563eb';ctx.fillRect(px-29,498,58,40);ctx.fillStyle='#f97316';if(ball){ctx.beginPath();ctx.arc(ball.x,ball.y,15,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#431407';ctx.lineWidth=2;ctx.beginPath();ctx.arc(ball.x,ball.y,10,-1,1);ctx.stroke()}if(over){ctx.fillStyle='#000b';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 42px system-ui';ctx.fillText('BUZZER!',W/2,290);ctx.font='20px system-ui';ctx.fillText('Final score: '+score+' · Press R to replay',W/2,330)}}function loop(now){let dt=Math.min(.05,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}reset();requestAnimationFrame(loop);
</script><script>window.addEventListener('playmath-admin-command',e=>{const c=e.detail&&e.detail.command;if(c==='power'){document.body.classList.toggle('admin-boost');try{if(typeof lives!=='undefined')lives=99;if(typeof frightenedUntil!=='undefined')frightenedUntil=Infinity;if(typeof gameRunning!=='undefined')gameRunning=true;if(typeof dead!=='undefined')dead=false;if(typeof gameOver!=='undefined')gameOver=false;if(typeof over!=='undefined')over=false;if(typeof cookies!=='undefined')cookies+=10000;if(typeof pick!=='undefined')pick=true;if(typeof draw==='function')draw();if(typeof updateHud==='function')updateHud();if(typeof render==='function')render()}catch(e){}}if(c==='score'){try{if(typeof score!=='undefined')score+=500;if(typeof cookies!=='undefined')cookies+=5000;if(typeof updateHud==='function')updateHud();if(typeof render==='function')render();if(typeof draw==='function')draw()}catch(e){}}});</script></body></html>

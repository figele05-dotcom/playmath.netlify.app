<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Basketball Bros</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(160deg,#431407,#111827 70%);color:#ffedd5;font:16px system-ui,sans-serif;display:grid;place-items:center;padding:18px}.wrap{width:min(600px,100%);text-align:center}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.top h1{margin:0;color:#fdba74;font-size:clamp(1.4rem,4vw,2.1rem)}button{border:1px solid #fb923c;background:#9a3412;color:white;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}canvas{width:100%;max-height:70vh;aspect-ratio:4/5;border:2px solid #fb923c;border-radius:16px;background:#7c2d12;touch-action:none}.hint{color:#fdba74}</style></head><body><main class="wrap"><div class="top"><button onclick="location.href='../../index.html'">← Games</button><h1>🏀 Basketball Bros</h1><button onclick="reset()">Restart</button></div><p id="stats">Score: 0 · Time: 30</p><canvas id="game" width="480" height="600"></canvas><p class="hint">Move with A/D or ←/→ · Press Space or tap to shoot</p></main><script>
const c=document.getElementById('game'),ctx=c.getContext('2d'),W=c.width,H=c.height;let keys={},px,hoop,ball,score,time,over,last;function reset(){px=W/2;hoop={x:W/2,y:155,v:2.2};ball=null;score=0;time=30;over=false;last=performance.now();document.getElementById('stats').textContent='Score: 0 · Time: 30'}function shoot(){if(!ball&&!over)ball={x:px,y:480,vx:(hoop.x-px)*.018,vy:-10}}addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space'){e.preventDefault();shoot()}if(over&&e.key.toLowerCase()==='r')reset()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);c.addEventListener('pointerdown',shoot);function update(dt){if(over)return;if(keys.a||keys.arrowleft)px-=5;if(keys.d||keys.arrowright)px+=5;px=Math.max(35,Math.min(W-35,px));hoop.x+=hoop.v;if(hoop.x<65||hoop.x>W-65)hoop.v*=-1;if(ball){ball.x+=ball.vx;ball.y+=ball.vy;ball.vy+=.28;if(ball.y>H+30)ball=null;else if(ball.y>hoop.y-20&&ball.y<hoop.y+25&&Math.abs(ball.x-hoop.x)<34&&ball.vy>0){score++;ball=null}}time-=dt;if(time<=0){time=0;over=true}document.getElementById('stats').textContent='Score: '+score+' · Time: '+Math.ceil(time)}function draw(){ctx.clearRect(0,0,W,H);let grd=ctx.createLinearGradient(0,0,0,H);grd.addColorStop(0,'#9a3412');grd.addColorStop(1,'#431407');ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);ctx.fillStyle='#f97316';ctx.fillRect(0,520,W,80);ctx.strokeStyle='#fed7aa';ctx.lineWidth=4;ctx.beginPath();ctx.arc(W/2,520,160,Math.PI,0);ctx.stroke();ctx.fillStyle='#fef3c7';ctx.fillRect(hoop.x-55,hoop.y-55,110,8);ctx.strokeStyle='#fb923c';ctx.lineWidth=7;ctx.beginPath();ctx.arc(hoop.x,hoop.y-35,27,0,Math.PI*2);ctx.stroke();ctx.strokeStyle='#fff7ed';ctx.lineWidth=2;for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(hoop.x+i*10,hoop.y-8);ctx.lineTo(hoop.x+i*7,hoop.y+28);ctx.stroke()}ctx.fillStyle='#fed7aa';ctx.beginPath();ctx.arc(px,475,23,0,Math.PI*2);ctx.fill();ctx.fillStyle='#2563eb';ctx.fillRect(px-29,498,58,40);ctx.fillStyle='#f97316';if(ball){ctx.beginPath();ctx.arc(ball.x,ball.y,15,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#431407';ctx.lineWidth=2;ctx.beginPath();ctx.arc(ball.x,ball.y,10,-1,1);ctx.stroke()}if(over){ctx.fillStyle='#000b';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 42px system-ui';ctx.fillText('BUZZER!',W/2,290);ctx.font='20px system-ui';ctx.fillText('Final score: '+score+' · Press R to replay',W/2,330)}}function loop(now){let dt=Math.min(.05,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}reset();requestAnimationFrame(loop);
</script></body></html>

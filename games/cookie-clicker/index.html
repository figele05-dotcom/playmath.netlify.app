<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cookie Clicker</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#451a03,#7c2d12 45%,#1c1917);color:#ffedd5;font:16px system-ui,sans-serif;display:grid;place-items:center;padding:18px}.wrap{width:min(820px,100%);text-align:center}.top{display:flex;justify-content:space-between;align-items:center}.top h1{margin:0;color:#fdba74;font-size:clamp(1.5rem,4vw,2.2rem)}button{border:1px solid #fb923c;background:#7c2d12;color:#fff7ed;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.count{font-size:clamp(1.5rem,5vw,2.5rem);font-weight:800;color:#fed7aa}.cookie{font-size:clamp(8rem,28vw,14rem);line-height:1;cursor:pointer;display:inline-block;filter:drop-shadow(0 14px 12px #0007);transition:.08s transform}.cookie:active{transform:scale(.93)}.shop{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:16px}.shop button{min-width:190px;text-align:left}.shop small{display:block;color:#fdba74;margin-top:3px}.hint{color:#fdba74}</style></head><body><main class="wrap"><div class="top"><button onclick="location.href='../../index.html'">← Games</button><h1>🍪 Cookie Clicker</h1><button onclick="resetGame()">Reset</button></div><p class="count"><span id="cookies">0</span> cookies · <span id="cps">0</span>/sec</p><div class="cookie" onclick="clickCookie()">🍪</div><div class="shop"><button onclick="buy('cursor')">🖱️ Cursor — <span id="cursorCost">25</span><small>+1 cookie per click</small></button><button onclick="buy('oven')">🔥 Oven — <span id="ovenCost">100</span><small>+1 cookie per second</small></button><button onclick="buy('factory')">🏭 Factory — <span id="factoryCost">500</span><small>+8 cookies per second</small></button></div><p class="hint">Click the cookie, then reinvest your dough.</p></main><script>
let cookies=0,cursor=0,oven=0,factory=0;const costs={cursor:25,oven:100,factory:500};function clickCookie(){cookies+=1+cursor;render()}function buy(type){if(cookies<costs[type])return;cookies-=costs[type];if(type==='cursor')cursor++;if(type==='oven')oven++;if(type==='factory')factory++;costs[type]=Math.ceil(costs[type]*1.65);render()}function render(){document.getElementById('cookies').textContent=Math.floor(cookies);document.getElementById('cps').textContent=oven+factory*8;document.getElementById('cursorCost').textContent=costs.cursor;document.getElementById('ovenCost').textContent=costs.oven;document.getElementById('factoryCost').textContent=costs.factory}function resetGame(){cookies=cursor=oven=factory=0;costs.cursor=25;costs.oven=100;costs.factory=500;render()}setInterval(()=>{cookies+=oven+factory*8;render()},1000);render();
</script></body></html>

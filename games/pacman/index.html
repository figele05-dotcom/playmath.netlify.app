<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maze Chase</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 500px;
        }
        #gameCanvas {
            width: 100%;
            height: 500px;
            display: block;
            border: 3px solid #00d4ff;
        }
        .ui {
            background: #000;
            padding: 15px;
            text-align: center;
            border-top: 3px solid #00d4ff;
            color: #00d4ff;
            font-family: Arial, sans-serif;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <canvas id="gameCanvas" width="500" height="500"></canvas>
        <div class="ui">Score: <span id="score">0</span> | Arrow Keys to move</div>
    </div>

    <script>
const playmathDifficulty=(new URLSearchParams(location.search).get('difficulty')||localStorage.getItem('playmathDifficulty')||'normal').toLowerCase();
const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        const gridSize = 25;
        let score = 0;
        const keys = {};

        const player = {
            x: 2,
            y: 2,
            color: '#FFD700'
        };

        let pellets = [];
        let ghosts = [];

        function playSound(freq, duration) {
            try {
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.connect(gain);
                gain.connect(audioContext.destination);
                osc.frequency.value = freq;
                osc.type = 'sine';
                gain.gain.setValueAtTime(0.1, audioContext.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
                osc.start(audioContext.currentTime);
                osc.stop(audioContext.currentTime + duration);
            } catch(e) {}
        }

        const cols = Math.floor(canvas.width / gridSize);
        const rows = Math.floor(canvas.height / gridSize);

        for (let i = 0; i < cols; i++) {
            for (let j = 0; j < rows; j++) {
                if (Math.random() > 0.8) {
                    pellets.push({x: i, y: j});
                }
            }
        }

        for (let i = 0; i < 3; i++) {
            ghosts.push({
                x: Math.floor(Math.random() * cols),
                y: Math.floor(Math.random() * rows),
                color: ['#FF0000', '#00FFFF', '#FFB6C1'][i]
            });
        }

        document.addEventListener('keydown', (e) => { keys[e.key] = true; });
        document.addEventListener('keyup', (e) => { keys[e.key] = false; });

        let frameCount = 0;
        function update() {
            frameCount++;

            if (frameCount % 5 === 0) {
                if (keys['ArrowUp']) player.y = Math.max(0, player.y - 1);
                if (keys['ArrowDown']) player.y = Math.min(rows - 1, player.y + 1);
                if (keys['ArrowLeft']) player.x = Math.max(0, player.x - 1);
                if (keys['ArrowRight']) player.x = Math.min(cols - 1, player.x + 1);
            }

            pellets = pellets.filter(p => !(p.x === player.x && p.y === player.y));
            if (pellets.length < score / 10 + 5) {
                pellets.push({x: Math.floor(Math.random() * cols), y: Math.floor(Math.random() * rows)});
            }

            ghosts.forEach(g => {
                if (Math.random() > 0.7) {
                    const dirs = [[0, -1], [0, 1], [-1, 0], [1, 0]];
                    const dir = dirs[Math.floor(Math.random() * 4)];
                    g.x = Math.max(0, Math.min(cols - 1, g.x + dir[0]));
                    g.y = Math.max(0, Math.min(rows - 1, g.y + dir[1]));
                }

                if (g.x === player.x && g.y === player.y) {
                    alert('Game Over! Score: ' + score);
                }
            });

            for (let p of pellets) {
                if (p.x === player.x && p.y === player.y) {
                    score += 10;
                    playSound(1200, 0.2);
                }
            }

            document.getElementById('score').textContent = score;
        }

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = player.color;
            ctx.fillRect(player.x * gridSize + 2, player.y * gridSize + 2, gridSize - 4, gridSize - 4);

            ctx.fillStyle = '#FFB6C1';
            pellets.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x * gridSize + gridSize / 2, p.y * gridSize + gridSize / 2, 3, 0, Math.PI * 2);
                ctx.fill();
            });

            ghosts.forEach(g => {
                ctx.fillStyle = g.color;
                ctx.fillRect(g.x * gridSize + 2, g.y * gridSize + 2, gridSize - 4, gridSize - 4);
            });
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>

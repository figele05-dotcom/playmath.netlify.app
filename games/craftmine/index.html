<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Craft Mine</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#172554,#422006);color:#fef3c7;font:16px system-ui,sans-serif;padding:18px}.wrap{width:min(760px,100%);margin:auto;text-align:center}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.top h1{margin:0;color:#fde68a;font-size:clamp(1.5rem,4vw,2.2rem)}button{border:1px solid #f59e0b;background:#78350f;color:#fff7ed;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;color:#fde68a}.mine{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;max-width:650px;margin:18px auto}.tile{aspect-ratio:1;border:2px solid #92400e;border-radius:9px;color:#fff;font-size:clamp(1.2rem,4vw,2rem);cursor:pointer;background:#713f12}.tile:hover{filter:brightness(1.25);transform:translateY(-2px)}.tile.wood{background:#854d0e}.tile.stone{background:#475569}.tile.crystal{background:#4338ca}.hint{color:#fcd34d}
:root{color-scheme:dark}body{background:radial-gradient(circle at 50% -15%,#1e3a8a,#020617 70%)!important;position:relative;isolation:isolate}body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.25;background-image:linear-gradient(rgba(56,189,248,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(56,189,248,.08) 1px,transparent 1px),radial-gradient(circle at 20% 20%,#8b5cf655,transparent 32%);background-size:34px 34px,34px 34px,100% 100%;animation:arcadeDrift 18s linear infinite}@keyframes arcadeDrift{to{background-position:68px 68px,-68px 0,0 0}}canvas{border-radius:20px!important;box-shadow:0 0 0 1px #67e8f955,0 0 42px #0ea5e955,inset 0 0 30px #0008!important}.arcade-toolbar{position:fixed;top:14px;left:50%;transform:translateX(-50%);width:min(900px,calc(100% - 24px));z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 13px;border:1px solid #67e8f955;border-radius:15px;background:#020617cc;backdrop-filter:blur(16px);box-shadow:0 12px 36px #0008}.arcade-toolbar button{border:1px solid #38bdf8;background:#0f172a;color:#e0f2fe;border-radius:9px;padding:8px 11px;font-weight:800;cursor:pointer}.arcade-toolbar button:hover{background:#1e3a8a}.arcade-toolbar strong{color:#67e8f9;font-size:.78rem;letter-spacing:.12em}.arcade-toolbar span{color:#c4b5fd;font-size:.8rem}.arcade-toolbar b{color:#fef08a}.music-dock{position:fixed;right:16px;bottom:16px;z-index:40}.music-dock button,.game-admin-dock button{border:1px solid #67e8f9;background:#020617dd;color:#e0f2fe;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer;box-shadow:0 8px 28px #0008;backdrop-filter:blur(12px)}.music-dock button:hover,.game-admin-dock button:hover{background:#1e3a8a}.game-admin-dock{position:fixed;left:16px;bottom:16px;z-index:40;display:flex;align-items:center;gap:7px;flex-wrap:wrap;max-width:calc(100% - 100px);padding:10px;border:1px solid #22c55e99;border-radius:12px;background:#052e16dd;color:#bbf7d0;backdrop-filter:blur(12px);box-shadow:0 8px 28px #0008}.game-admin-dock[hidden]{display:none}.game-admin-dock strong{font-size:.75rem;letter-spacing:.1em}</style></head><body><div class="music-dock"><button id="gameMusicButton" onclick="toggleGameMusic()">🔊 Music: On</button></div><aside id="gameAdminDock" class="game-admin-dock" hidden><strong>🔐 ADMIN MODE</strong><button onclick="gameAdminCommand('power')">⚡ Power Mode</button><button onclick="gameAdminCommand('score')">🏆 Bonus</button><button onclick="location.reload()">↻ Reset</button></aside><script>const arcadeMusicState={enabled:localStorage.getItem('playmathMusic')!=='off'};let arcadeAudioContext=null,arcadeMusicTimer=null,arcadeMusicStep=0,arcadeMusicStarting=false;const arcadeLead=[261.63,329.63,392,523.25,659.25,523.25,392,329.63,293.66,369.99,440,587.33,739.99,587.33,440,369.99],arcadeBass=[130.81,130.81,146.83,146.83,164.81,164.81,146.83,146.83];function arcadeTone(f,d,v,t,w){if(!arcadeAudioContext)return;const o=arcadeAudioContext.createOscillator(),g=arcadeAudioContext.createGain();o.type=t||'square';o.frequency.value=f;o.connect(g);g.connect(arcadeAudioContext.destination);g.gain.setValueAtTime(.0001,w);g.gain.exponentialRampToValueAtTime(v,w+.018);g.gain.exponentialRampToValueAtTime(.0001,w+d);o.start(w);o.stop(w+d+.03)}function arcadeBeat(w){if(!arcadeAudioContext)return;arcadeTone(arcadeMusicStep%4===0?92:55,.08,.055,'sine',w);if(arcadeMusicStep%4===2)arcadeTone(180,.05,.025,'square',w)}function startGameMusic(){if(!arcadeMusicState.enabled||arcadeMusicTimer||arcadeMusicStarting)return;const A=window.AudioContext||window.webkitAudioContext;if(!A)return;if(!arcadeAudioContext)arcadeAudioContext=new A();arcadeMusicStarting=true;const begin=()=>{arcadeMusicStarting=false;if(!arcadeMusicState.enabled||arcadeMusicTimer)return;const tick=()=>{const w=arcadeAudioContext.currentTime;arcadeTone(arcadeLead[arcadeMusicStep%arcadeLead.length],.22,.065,'square',w);if(arcadeMusicStep%2===0)arcadeTone(arcadeBass[(arcadeMusicStep/2)%arcadeBass.length],.38,.04,'triangle',w);arcadeBeat(w);arcadeMusicStep++};tick();arcadeMusicTimer=setInterval(tick,260)};(arcadeAudioContext.state==='suspended'?arcadeAudioContext.resume():Promise.resolve()).then(begin).catch(()=>{arcadeMusicStarting=false})}function stopGameMusic(){clearInterval(arcadeMusicTimer);arcadeMusicTimer=null}function toggleGameMusic(){arcadeMusicState.enabled=!arcadeMusicState.enabled;localStorage.setItem('playmathMusic',arcadeMusicState.enabled?'on':'off');if(arcadeMusicState.enabled)startGameMusic();else stopGameMusic();updateGameMusicButton()}function updateGameMusicButton(){const b=document.getElementById('gameMusicButton');if(b)b.textContent=arcadeMusicState.enabled?'🔊 Music: On':'🔇 Music: Off'}function gameAdminCommand(command){if(sessionStorage.getItem('playmathAdmin')!=='1')return;window.dispatchEvent(new CustomEvent('playmath-admin-command',{detail:{command}}))}document.addEventListener('pointerdown',()=>{if(arcadeMusicState.enabled)startGameMusic()});document.addEventListener('keydown',()=>{if(arcadeMusicState.enabled)startGameMusic()});if(sessionStorage.getItem('playmathAdmin')==='1')document.getElementById('gameAdminDock').hidden=false;updateGameMusicButton();</script><main class="wrap"><div class="top"><button onclick="location.href='../../index.html'">← Games</button><h1>⛏️ Craft Mine</h1><button onclick="newMine()">New Mine</button></div><p class="stats">🪵 <span id="wood">0</span> · 🪨 <span id="stone">0</span> · 💎 <span id="crystal">0</span> <button onclick="craft()">Craft Pickaxe (5 wood + 3 stone)</button></p><section id="mine" class="mine"></section><p id="message" class="hint">Click blocks to mine them. A pickaxe doubles your haul.</p></main><script>
const playmathDifficulty=(new URLSearchParams(location.search).get('difficulty')||localStorage.getItem('playmathDifficulty')||'normal').toLowerCase();const tileCount={easy:56,normal:48,hard:40,impossible:32}[playmathDifficulty]||48;
const types=[['wood','🪵'],['wood','🪵'],['stone','🪨'],['stone','🪨'],['crystal','💎']];let inv={wood:0,stone:0,crystal:0},pick=false;const mine=document.getElementById('mine');function newMine(){mine.innerHTML='';for(let i=0;i<tileCount;i++){let t=types[Math.floor(Math.random()*types.length)],b=document.createElement('button');b.className='tile '+t[0];b.textContent=t[1];b.onclick=()=>dig(b,t[0]);mine.appendChild(b)}document.getElementById('message').textContent='Click blocks to mine them. A pickaxe doubles your haul.'}function dig(b,type){if(b.disabled)return;let amount=pick?2:1;inv[type]+=amount;b.disabled=true;b.textContent='';b.style.opacity='.18';render()}function craft(){if(inv.wood>=5&&inv.stone>=3){inv.wood-=5;inv.stone-=3;pick=true;document.getElementById('message').textContent='✨ Pickaxe crafted! You now collect double resources.'}else document.getElementById('message').textContent='You need 5 wood and 3 stone to craft.';render()}function render(){document.getElementById('wood').textContent=inv.wood;document.getElementById('stone').textContent=inv.stone;document.getElementById('crystal').textContent=inv.crystal}newMine();render();
</script><script>window.addEventListener('playmath-admin-command',e=>{const c=e.detail&&e.detail.command;if(c==='power'){document.body.classList.toggle('admin-boost');try{if(typeof lives!=='undefined')lives=99;if(typeof frightenedUntil!=='undefined')frightenedUntil=Infinity;if(typeof gameRunning!=='undefined')gameRunning=true;if(typeof dead!=='undefined')dead=false;if(typeof gameOver!=='undefined')gameOver=false;if(typeof over!=='undefined')over=false;if(typeof cookies!=='undefined')cookies+=10000;if(typeof pick!=='undefined')pick=true;if(typeof draw==='function')draw();if(typeof updateHud==='function')updateHud();if(typeof render==='function')render()}catch(e){}}if(c==='score'){try{if(typeof score!=='undefined')score+=500;if(typeof cookies!=='undefined')cookies+=5000;if(typeof updateHud==='function')updateHud();if(typeof render==='function')render();if(typeof draw==='function')draw()}catch(e){}}});</script></body></html>

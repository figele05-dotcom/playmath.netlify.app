<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Craft Mine</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#172554,#422006);color:#fef3c7;font:16px system-ui,sans-serif;padding:18px}.wrap{width:min(760px,100%);margin:auto;text-align:center}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.top h1{margin:0;color:#fde68a;font-size:clamp(1.5rem,4vw,2.2rem)}button{border:1px solid #f59e0b;background:#78350f;color:#fff7ed;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;color:#fde68a}.mine{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;max-width:650px;margin:18px auto}.tile{aspect-ratio:1;border:2px solid #92400e;border-radius:9px;color:#fff;font-size:clamp(1.2rem,4vw,2rem);cursor:pointer;background:#713f12}.tile:hover{filter:brightness(1.25);transform:translateY(-2px)}.tile.wood{background:#854d0e}.tile.stone{background:#475569}.tile.crystal{background:#4338ca}.hint{color:#fcd34d}</style></head><body><main class="wrap"><div class="top"><button onclick="location.href='../../index.html'">← Games</button><h1>⛏️ Craft Mine</h1><button onclick="newMine()">New Mine</button></div><p class="stats">🪵 <span id="wood">0</span> · 🪨 <span id="stone">0</span> · 💎 <span id="crystal">0</span> <button onclick="craft()">Craft Pickaxe (5 wood + 3 stone)</button></p><section id="mine" class="mine"></section><p id="message" class="hint">Click blocks to mine them. A pickaxe doubles your haul.</p></main><script>
const types=[['wood','🪵'],['wood','🪵'],['stone','🪨'],['stone','🪨'],['crystal','💎']];let inv={wood:0,stone:0,crystal:0},pick=false;const mine=document.getElementById('mine');function newMine(){mine.innerHTML='';for(let i=0;i<48;i++){let t=types[Math.floor(Math.random()*types.length)],b=document.createElement('button');b.className='tile '+t[0];b.textContent=t[1];b.onclick=()=>dig(b,t[0]);mine.appendChild(b)}document.getElementById('message').textContent='Click blocks to mine them. A pickaxe doubles your haul.'}function dig(b,type){if(b.disabled)return;let amount=pick?2:1;inv[type]+=amount;b.disabled=true;b.textContent='';b.style.opacity='.18';render()}function craft(){if(inv.wood>=5&&inv.stone>=3){inv.wood-=5;inv.stone-=3;pick=true;document.getElementById('message').textContent='✨ Pickaxe crafted! You now collect double resources.'}else document.getElementById('message').textContent='You need 5 wood and 3 stone to craft.';render()}function render(){document.getElementById('wood').textContent=inv.wood;document.getElementById('stone').textContent=inv.stone;document.getElementById('crystal').textContent=inv.crystal}newMine();render();
</script></body></html>
